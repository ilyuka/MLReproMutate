name: Feature or mutation operator request
description: Suggest a feature, workflow improvement, or reproducibility mutation operator
title: "[Feature]: "
body:
  - type: dropdown
    id: kind
    attributes:
      label: Request type
      options:
        - New mutation operator
        - Existing operator improvement
        - CLI improvement
        - Reporting / output improvement
        - Documentation
        - Other
    validations:
      required: true

  - type: textarea
    id: problem
    attributes:
      label: Research or software problem
      description: What problem would this change help address?
    validations:
      required: true

  - type: textarea
    id: proposal
    attributes:
      label: Proposed behavior
      description: Describe the feature or mutation you would like MLReproMutate to support.
    validations:
      required: true

  - type: textarea
    id: example
    attributes:
      label: Example
      description: |
        If applicable, provide a small code/configuration example showing the
        reproducibility-relevant choice.

  - type: textarea
    id: references
    attributes:
      label: Research context or references
      description: Optional papers, repositories, or examples motivating the request.
