name: Bug report
description: Report a reproducible problem with MLReproMutate
title: "[Bug]: "
body:
  - type: markdown
    attributes:
      value: |
        Thanks for reporting a problem with MLReproMutate.
        Please provide enough information to reproduce the issue.

  - type: input
    id: version
    attributes:
      label: MLReproMutate version
      description: For example, 0.1.1 or a Git commit SHA.
      placeholder: "0.1.1"
    validations:
      required: true

  - type: dropdown
    id: installation
    attributes:
      label: Installation method
      options:
        - PyPI
        - Editable/source install
        - Other
    validations:
      required: true

  - type: dropdown
    id: operator
    attributes:
      label: Mutation operator
      options:
        - random-seed
        - dependency-pin
        - data-split
        - cv-fold-count
        - Not operator-specific
    validations:
      required: true

  - type: input
    id: python
    attributes:
      label: Python version
      placeholder: "3.12.5"
    validations:
      required: true

  - type: input
    id: os
    attributes:
      label: Operating system
      placeholder: "Ubuntu 24.04"
    validations:
      required: true

  - type: textarea
    id: command
    attributes:
      label: Command
      description: Paste the MLReproMutate command that produced the problem.
      render: shell
    validations:
      required: true

  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
    validations:
      required: true

  - type: textarea
    id: actual
    attributes:
      label: Observed behavior
    validations:
      required: true

  - type: textarea
    id: logs
    attributes:
      label: Relevant output or traceback
      description: Remove secrets or sensitive paths before posting.
      render: text

  - type: textarea
    id: context
    attributes:
      label: Additional context
      description: Anything else that may help reproduce or understand the problem.

  - type: checkboxes
    id: checks
    attributes:
      label: Checklist
      options:
        - label: I have removed secrets and sensitive information from the report.
          required: true
        - label: I have checked that this issue is not already reported.
          required: true
