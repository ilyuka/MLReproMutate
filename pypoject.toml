[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "mlrepromutate"
version = "0.0.0"
description = "Mutation testing for reproducibility safeguards in machine-learning experiments"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [
    { name = "YOUR NAME" }
]

dependencies = [
    "typer>=0.12",
]

[project.optional-dependencies]
dev = [
    "pytest>=8",
    "pytest-cov>=5",
    "ruff>=0.6",
]

[project.scripts]
mlrepromutate = "mlrepromutate.cli:app"

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 88